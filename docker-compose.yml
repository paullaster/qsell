# =============================================================================
# Development Docker Compose
# =============================================================================

services:
  # --------------------------------------------------------
  # PostgreSQL 18 with optimized settings
  # --------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: qsell-postgres
    environment:
      POSTGRES_DB: qsell
      POSTGRES_USER: qsell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qsell_dev_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qsell -d qsell"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 1G
          cpus: '1'
    command: >
      postgres
      -c max_connections=300
      -c shared_buffers=512MB
      -c effective_cache_size=1536MB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=4MB
      -c min_wal_size=1GB
      -c max_wal_size=4GB

  # --------------------------------------------------------
  # Redis 7 for caching, sessions, and BullMQ queues
  # --------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: qsell-redis
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'

  # --------------------------------------------------------
  # Next.js Development Server with Turbopack
  # --------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: qsell-app
    environment:
      - NODE_ENV=development
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=postgresql://qsell:${POSTGRES_PASSWORD:-qsell_dev_password}@postgres:5432/qsell
      - REDIS_URL=redis://redis:6379
      - NEXT_TELEMETRY_DISABLED=1
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3069:3069"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pnpm dev
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - node_modules/
            - .next/
            - .git/
            - docker/

  # --------------------------------------------------------
  # Graphile Worker for background jobs
  # --------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    container_name: qsell-worker
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://qsell:${POSTGRES_PASSWORD:-qsell_dev_password}@postgres:5432/qsell
      - REDIS_URL=redis://redis:6379
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: pnpm worker:dev
    deploy:
      resources:
        limits:
          memory: 1G

  # --------------------------------------------------------
  # pgAdmin for database management (dev only)
  # --------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:8
    container_name: qsell-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@qsell.local
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  default:
    name: qsell-network
