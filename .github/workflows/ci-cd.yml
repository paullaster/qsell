name: Release pipeline

on:
  pull_request:
    branches: [release]
  push:
    branches: [release]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: qsell
          POSTGRES_USER: qsell
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U qsell -d qsell"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://qsell:ci-only-password@localhost:5432/qsell
      - name: Typecheck
        run: pnpm typecheck
      - name: Production build
        run: pnpm build
        env:
          NODE_ENV: production
          AUTH_SECRET: ci-only-auth-secret-not-for-deployment
          NEXTAUTH_URL: http://localhost:3069
          DATABASE_URL: postgresql://qsell:ci-only-password@localhost:5432/qsell

  publish:
    name: Build and publish release images
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          build-args: |
            DEPLOYMENT_VERSION=${{ github.sha }}

      - name: Build and publish worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:worker-${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build and publish migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:migrator-${{ github.sha }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator

  deploy:
    name: Deploy the published release
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      - name: Install pinned host key
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Copy Compose and TLS proxy config
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'mkdir -p /opt/qsell'
          scp compose.production.yaml Caddyfile "$DEPLOY_USER@$DEPLOY_HOST:/opt/qsell/"
      - name: Authenticate server to GHCR
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          printf '%s' "$GHCR_READ_TOKEN" | ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login ghcr.io --username '$GHCR_USERNAME' --password-stdin"
      - name: Deploy images by commit tag
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "APP_IMAGE='$IMAGE_NAME:sha-$RELEASE_SHA' \
             WORKER_IMAGE='$IMAGE_NAME:worker-$RELEASE_SHA' \
             MIGRATOR_IMAGE='$IMAGE_NAME:migrator-$RELEASE_SHA' sh -s" <<'REMOTE'
          set -eu
          cd /opt/qsell
          test -s .env.runtime || { echo 'Missing /opt/qsell/.env.runtime'; exit 1; }
          test -s secrets/postgres_password || { echo 'Missing /opt/qsell/secrets/postgres_password'; exit 1; }
          umask 077
          printf 'APP_IMAGE=%s\nWORKER_IMAGE=%s\nMIGRATOR_IMAGE=%s\n' \
            "$APP_IMAGE" "$WORKER_IMAGE" "$MIGRATOR_IMAGE" > .env.deploy

          compose() {
            docker compose --env-file .env.deploy -f compose.production.yaml "$@"
          }

          compose --profile ops pull
          compose --profile ops run --rm migrate
          compose up -d --remove-orphans

          for attempt in $(seq 1 30); do
            if compose exec -T app node -e "fetch('http://127.0.0.1:3069/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
              echo 'Application health check passed.'
              exit 0
            fi
            sleep 5
          done

          compose ps
          compose logs --tail=100 app
          exit 1
          REMOTE

      - name: Verify public HTTPS endpoint
        run: |
          curl --fail --silent --show-error --retry 20 --retry-delay 5 \
            https://onmicommerce.brainsporellc.com/api/health
