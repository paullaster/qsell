name: Release build pipeline

on:
  pull_request:
    branches: [release]
  push:
    branches: [release]

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 24
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: qsell
          POSTGRES_USER: qsell
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U qsell -d qsell"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply database migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: postgresql://qsell:ci-only-password@localhost:5432/qsell
      - name: Typecheck
        run: pnpm typecheck
      - name: Run unit, integration and API tests
        # Integration tests run against the migrated database above (built from the
        # migration SQL, so the hand-added append-only triggers are exercised).
        # Lint is not gated yet: it crashes under ESLint 10 and has pre-existing violations.
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgresql://qsell:ci-only-password@localhost:5432/qsell
          AUTH_SECRET: ci-only-auth-secret-not-for-deployment
      - name: Verify media storage adapters
        # Runs the Cloudinary adapter against a local fake: retries, timeouts, signed private
        # links and the "private upload must not land public" safety check. No credentials needed.
        run: pnpm media:verify
      - name: Production build
        run: pnpm build
        env:
          NODE_ENV: production
          AUTH_SECRET: ci-only-auth-secret-not-for-deployment
          NEXTAUTH_URL: http://localhost:3069
          DATABASE_URL: postgresql://qsell:ci-only-password@localhost:5432/qsell

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: qsell_e2e
          POSTGRES_USER: qsell
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U qsell -d qsell_e2e"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chrome and the tools the run uses
        # Chrome drives the tests; psmisc provides fuser, which stops the test server afterwards.
        run: |
          sudo apt-get update
          sudo apt-get install -y psmisc
          pnpm exec playwright install --with-deps chrome
      - name: Run end-to-end tests (desktop and phone width)
        # The run migrates, seeds and logs in on its own database and port; see e2e/README.md.
        run: pnpm test:e2e
        env:
          E2E_DATABASE_URL: postgresql://qsell:ci-only-password@localhost:5432/qsell_e2e
          AUTH_SECRET: ci-only-auth-secret-not-for-deployment
          JWT_SECRET: ci-only-jwt-secret-not-for-deployment
          DATA_ENCRYPTION_KEY: ci-only-data-encryption-key-not-for-deployment
          CI: 'true'
      - name: Keep the report when a test fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: test-results
          retention-days: 7

  publish:
    name: Build and publish release images
    needs: [validate, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
          build-args: |
            DEPLOYMENT_VERSION=${{ github.sha }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            SERVER_ACTION_ALLOWED_ORIGINS=${{ vars.SERVER_ACTION_ALLOWED_ORIGINS || 'omnicommerce.brainsporellc.com' }}
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Build and publish worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:worker-${{ github.sha }}
          cache-from: type=gha,scope=worker
          cache-to: type=gha,mode=max,scope=worker

      - name: Build and publish migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_NAME }}:migrator-${{ github.sha }}
          cache-from: type=gha,scope=migrator
          cache-to: type=gha,mode=max,scope=migrator
