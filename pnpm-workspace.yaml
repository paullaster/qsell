allowBuilds:
  '@sentry/node-cpu-profiler': true
  esbuild: false
  unrs-resolver: false
# Corepack, CI setup, and Docker pin the executable to pnpm 12.6.0. Avoid
# recording/downloading pnpm's standalone environment package in production;
# the runtime images warm the required executable cache during image build.
minimumReleaseAgeExclude:
  - '@next/env@16.4.3'
  - '@next/eslint-plugin-next@16.4.3'
  - '@next/swc-darwin-arm64@16.4.3'
  - '@next/swc-darwin-x64@16.4.3'
  - '@next/swc-linux-arm64-gnu@16.4.3'
  - '@next/swc-linux-arm64-musl@16.4.3'
  - '@next/swc-linux-x64-gnu@16.4.3'
  - '@next/swc-linux-x64-musl@16.4.3'
  - '@next/swc-win32-arm64-msvc@16.4.3'
  - '@next/swc-win32-x64-msvc@16.4.3'
  - eslint-config-next@16.4.3
  - next@16.4.3
pmOnFail: ignore
