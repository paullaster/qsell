# =============================================================================
# Production Docker Compose - High Traffic Optimized
# =============================================================================

services:
  # --------------------------------------------------------
  # PostgreSQL 18 - Production Tuned
  # --------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: qsell-postgres-prod
    environment:
      POSTGRES_DB: qsell
      POSTGRES_USER: qsell
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qsell -d qsell"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '4'
        reservations:
          memory: 2G
          cpus: '2'
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
    command: >
      postgres
      -c max_connections=500
      -c superuser_reserved_connections=5
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c maintenance_work_mem=256MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=64MB
      -c default_statistics_target=500
      -c random_page_cost=1.1
      -c effective_io_concurrency=200
      -c work_mem=8MB
      -c min_wal_size=2GB
      -c max_wal_size=8GB
      -c wal_writer_delay=10ms
      -c wal_writer_flush_after=1MB
      -c synchronous_commit=on
      -c full_page_writes=on
      -c max_worker_processes=8
      -c max_parallel_workers_per_gather=4
      -c max_parallel_workers=8
      -c parallel_leader_participation=on
      -c log_min_duration_statement=1000
      -c log_checkpoints=on
      -c log_connections=on
      -c log_disconnections=on
      -c log_lock_waits=on
      -c log_temp_files=0
      -c track_io_timing=on
      -c track_functions=all

  # --------------------------------------------------------
  # Redis 7 Cluster-ready
  # --------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: qsell-redis-prod
    command: >
      redis-server
      --maxmemory 1gb
      --maxmemory-policy allkeys-lfu
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec
      --no-appendfsync-on-rewrite no
      --aof-rewrite-incremental-fsync yes
      --rdb-save-incremental-fsync yes
      --lazyfree-lazy-eviction yes
      --lazyfree-lazy-expire yes
      --lazyfree-lazy-server-del yes
      --repl-diskless-sync yes
      --repl-diskless-sync-delay 5
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "$$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2'
        reservations:
          memory: 1G
          cpus: '1'
      restart_policy:
        condition: on-failure
    environment:
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
    secrets:
      - redis_password

  # --------------------------------------------------------
  # Next.js Production - Multiple replicas for HA
  # --------------------------------------------------------
  app:
    image: qsell/app:latest
    container_name: qsell-app-prod
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - DATABASE_URL=postgresql://qsell:$$POSTGRES_PASSWORD@postgres:5432/qsell?connection_limit=20&pool_timeout=10
      - REDIS_URL=redis://:$$REDIS_PASSWORD@redis:6379
      - PORT=3069
      - HOSTNAME=0.0.0.0
    secrets:
      - postgres_password
      - redis_password
      - nextjs_secrets
    ports:
      - "127.0.0.1:3069:3069"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3069/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 4
      resources:
        limits:
          memory: 1.5G
          cpus: '2'
        reservations:
          memory: 512M
          cpus: '1'
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
      update_config:
        parallelism: 2
        delay: 10s
        failure_action: rollback
        monitor: 30s
        max_failure_ratio: 0.1
      placement:
        constraints:
          - node.role == worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --------------------------------------------------------
  # Graphile Worker - Background Job Processing
  # --------------------------------------------------------
  worker:
    image: qsell/app:latest
    container_name: qsell-worker-prod
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://qsell:$$POSTGRES_PASSWORD@postgres:5432/qsell?connection_limit=10
      - REDIS_URL=redis://:$$REDIS_PASSWORD@redis:6379
      - WORKER_CONCURRENCY=10
      - WORKER_POLL_INTERVAL=1000
    secrets:
      - postgres_password
      - redis_password
      - nextjs_secrets
    deploy:
      replicas: 2
      resources:
        limits:
          memory: 1G
          cpus: '1'
        reservations:
          memory: 256M
          cpus: '0.5'
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["node", "worker.js"]

  # --------------------------------------------------------
  # Nginx Reverse Proxy with TLS Termination
  # --------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: qsell-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx_cache:/var/cache/nginx
      - nginx_logs:/var/log/nginx
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 64M
          cpus: '0.25'
      restart_policy:
        condition: on-failure
    depends_on:
      - app

  # --------------------------------------------------------
  # Prometheus for Metrics Collection
  # --------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.52
    container_name: qsell-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1'
      profiles:
        - monitoring

  # --------------------------------------------------------
  # Grafana for Visualization
  # --------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4
    container_name: qsell-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD_FILE=/run/secrets/grafana_password
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    secrets:
      - grafana_password
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
      profiles:
        - monitoring

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  nginx_cache:
  nginx_logs:

secrets:
  postgres_password:
    file: ./secrets/postgres_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  nextjs_secrets:
    file: ./secrets/nextjs_secrets.txt
  grafana_password:
    file: ./secrets/grafana_password.txt

networks:
  default:
    name: qsell-prod-network
    driver: overlay
    attachable: true
