# =============================================================================
# Nginx Configuration for High-Traffic Next.js Application
# =============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # =========================================================================
    # Logging
    # =========================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time" '
                    'cache="$upstream_cache_status"';

    log_format json escape=json
        '{ "time": "$time_iso8601", "remote_addr": "$remote_addr", '
        '"request": "$request", "status": $status, '
        '"body_bytes_sent": $body_bytes_sent, "request_time": $request_time, '
        '"upstream_response_time": $upstream_response_time, '
        '"upstream_cache_status": "$upstream_cache_status", '
        '"http_referer": "$http_referer", "http_user_agent": "$http_user_agent" }';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # =========================================================================
    # Performance Optimizations
    # =========================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    reset_timedout_connection on;
    client_body_timeout 30s;
    client_header_timeout 10s;
    send_timeout 30s;

    # Buffer sizes
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_max_body_size 50M;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml
        application/rss+xml application/atom+xml
        image/svg+xml application/x-font-ttf application/x-web-app-manifest+json
        font/opentype application/wasm;

    # Brotli (requires nginx-module-brotli)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cache
    open_file_cache max=10000 inactive=60s;
    open_file_cache_valid 120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # =========================================================================
    # Upstream Servers
    # =========================================================================
    upstream nextjs_backend {
        least_conn;
        server app_1:3069 max_fails=3 fail_timeout=10s;
        server app_2:3069 max_fails=3 fail_timeout=10s;
        server app_3:3069 max_fails=3 fail_timeout=10s;
        server app_4:3069 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream nextjs_backup {
        server app_1:3069 backup;
    }

    # =========================================================================
    # Rate Limiting
    # =========================================================================
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=500r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # =========================================================================
    # Security Headers
    # =========================================================================
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # CSP - adjust for your needs
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://js.stripe.com https://cdn.jsdelivr.net;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' data: https://fonts.gstatic.com;
        img-src 'self' data: https: blob:;
        connect-src 'self' https://api.stripe.com https://api.mpesadaraja.com wss:;
        frame-src 'self' https://js.stripe.com https://hooks.stripe.com;
        form-action 'self';
        base-uri 'self';
        object-src 'none';
    " always;

    # =========================================================================
    # SSL Configuration
    # =========================================================================
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # OCSP Stapling
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # =========================================================================
    # Server: HTTP -> HTTPS Redirect
    # =========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name qsell.com www.qsell.com;

        # ACME challenge for Let's Encrypt
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # =========================================================================
    # Server: HTTPS Main Application
    # =========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name qsell.com www.qsell.com;

        # SSL Certificates
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_trusted_certificate /etc/nginx/ssl/chain.pem;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # Root directory for static files
        root /var/www/html;

        # =========================================================================
        # API Routes - Rate Limited
        # =========================================================================
        location /api/ {
            limit_req zone=api_limit burst=200 nodelay;
            limit_conn conn_limit 50;

            proxy_pass http://nextjs_backend;
            include /etc/nginx/proxy_params;

            # Cache control for API
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        }

        # Auth endpoints - stricter rate limiting
        location ~ ^/api/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            limit_conn conn_limit 10;

            proxy_pass http://nextjs_backend;
            include /etc/nginx/proxy_params;
        }

        # Webhooks - higher rate limit for payment providers
        location ~ ^/api/payments/.*/callback/ {
            limit_req zone=webhook_limit burst=1000 nodelay;
            limit_conn conn_limit 200;

            proxy_pass http://nextjs_backend;
            include /etc/nginx/proxy_params;

            # Longer timeouts for webhook processing
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # =========================================================================
        # Next.js Static Assets - Aggressive Caching
        # =========================================================================
        location /_next/static/ {
            proxy_pass http://nextjs_backend;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Next.js Public Assets
        location /public/ {
            proxy_pass http://nextjs_backend;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # =========================================================================
        # Image Optimization
        # =========================================================================
        location /_next/image {
            proxy_pass http://nextjs_backend;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # =========================================================================
        # Static Files (public folder)
        # =========================================================================
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|woff|woff2|svg|webp|avif)$ {
            root /var/www/html;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri @nextjs;
        }

        # =========================================================================
        # Main Application - Proxy to Next.js
        # =========================================================================
        location / {
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn conn_limit 100;

            proxy_pass http://nextjs_backend;
            include /etc/nginx/proxy_params;

            # Next.js specific headers
            proxy_set_header X-Nextjs-Preview "0";

            # Cache HTML for short time (stale-while-revalidate pattern)
            # Uncomment if using ISR
            # add_header Cache-Control "public, max-age=0, must-revalidate, stale-while-revalidate=30, stale-if-error=300" always;
        }

        # =========================================================================
        # Health Check Endpoint (no rate limit)
        # =========================================================================
        location /api/health {
            access_log off;
            proxy_pass http://nextjs_backend;
            include /etc/nginx/proxy_params;
        }

        # =========================================================================
        # Error Pages
        # =========================================================================
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;

        location = /50x.html {
            root /var/www/html;
            internal;
        }
    }

    # =========================================================================
    # Server: Monitoring (Internal Only)
    # =========================================================================
    server {
        listen 127.0.0.1:8080;
        server_name localhost;

        # Prometheus metrics
        location /metrics {
            stub_status on;
            access_log off;
        }

        # Nginx status
        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            deny all;
        }
    }
}
