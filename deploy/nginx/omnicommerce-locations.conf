# Instance template: deployment substitutes @@EDGE_HTTP_PORT@@ with the selected
# instance's loopback port. Include the generated instance snippet INSIDE the
# matching host HTTPS server block; keep ACME and TLS configuration unchanged.

client_max_body_size 50m;

location ^~ /.well-known/acme-challenge/ {
    root /var/www/html;
}

location /api/events {
    proxy_pass http://127.0.0.1:@@EDGE_HTTP_PORT@@;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
}

location ^~ /_next/static/ {
    proxy_pass http://127.0.0.1:@@EDGE_HTTP_PORT@@;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location / {
    proxy_pass http://127.0.0.1:@@EDGE_HTTP_PORT@@;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
}
