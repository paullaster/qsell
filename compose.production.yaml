name: qsell

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qsell
      POSTGRES_USER: qsell
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      # PostgreSQL 18 stores PGDATA below this versioned volume root.
      - postgres_data:/var/lib/postgresql
    shm_size: 256mb
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-2g}
    cpus: ${POSTGRES_CPUS:-2}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qsell -d qsell"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    networks: [data]
    security_opt:
      - no-new-privileges:true

  app:
    image: ${APP_IMAGE:?Set APP_IMAGE to an immutable GHCR tag}
    restart: unless-stopped
    init: true
    env_file:
      - ./.env.runtime
    environment:
      NODE_ENV: production
      PORT: 3069
      HOSTNAME: 0.0.0.0
    expose:
      - "3069"
    volumes:
      - next_cache:/app/.next/cache
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: ${APP_MEMORY_LIMIT:-1500m}
    cpus: ${APP_CPUS:-2}
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3069/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
    networks: [data, edge]
    security_opt:
      - no-new-privileges:true

  worker:
    image: ${WORKER_IMAGE:?Set WORKER_IMAGE to an immutable GHCR tag}
    restart: unless-stopped
    init: true
    env_file:
      - ./.env.runtime
    environment:
      NODE_ENV: production
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
    mem_limit: ${WORKER_MEMORY_LIMIT:-512m}
    cpus: ${WORKER_CPUS:-1}
    depends_on:
      db:
        condition: service_healthy
    networks: [data]
    security_opt:
      - no-new-privileges:true

  migrate:
    image: ${MIGRATOR_IMAGE:?Set MIGRATOR_IMAGE to an immutable GHCR tag}
    profiles: [ops]
    env_file:
      - ./.env.runtime
    environment:
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    networks: [data]
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    init: true
    ports:
      # Existing host Nginx retains public 80/443 and forwards to Caddy here.
      # Caddy then routes requests to the web app over the Compose network.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    mem_limit: ${CADDY_MEMORY_LIMIT:-128m}
    depends_on:
      app:
        condition: service_healthy
    networks: [edge]
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  next_cache:
  caddy_data:
  caddy_config:

secrets:
  postgres_password:
    file: ./secrets/postgres_password

networks:
  data:
    internal: true
  edge:
