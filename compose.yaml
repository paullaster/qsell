name: qsell-dev

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qsell
      POSTGRES_USER: qsell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-qsell-dev-only}
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5434:5432"
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qsell -d qsell"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  app:
    build:
      context: .
      target: development
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3069
      HOSTNAME: 0.0.0.0
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-before-deploy}
      NEXTAUTH_URL: http://localhost:3069
      DATABASE_URL: postgresql://qsell:${POSTGRES_PASSWORD:-qsell-dev-only}@db:5432/qsell
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_next:/app/.next
    ports:
      - "127.0.0.1:3069:3069"
    depends_on:
      db:
        condition: service_healthy
    init: true

  worker:
    build:
      context: .
      target: development
    profiles: [worker]
    restart: unless-stopped
    environment:
      NODE_ENV: development
      AUTH_SECRET: ${AUTH_SECRET:-local-development-secret-change-before-deploy}
      DATABASE_URL: postgresql://qsell:${POSTGRES_PASSWORD:-qsell-dev-only}@db:5432/qsell
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    command: ["pnpm", "worker"]
    depends_on:
      db:
        condition: service_healthy
    init: true

volumes:
  postgres_data:
  app_node_modules:
  app_next:
